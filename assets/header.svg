<svg fill="none" viewBox="0 0 1200 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          position: relative;
          width: 1200px;
          height: 440px;
          background: radial-gradient(circle at 15% 10%, #201735 0%, #070b14 60%, #030712 100%);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          overflow: hidden;
          color: #ffffff;
          box-sizing: border-box;
          user-select: none;
        }

        /* Star twinkling animations */
        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 0.95; transform: scale(1.3); }
        }

        .star {
          position: absolute;
          background: #ffffff;
          border-radius: 50%;
          animation: twinkle 3s infinite ease-in-out;
        }

        /* Glowing Planet Horizon */
        .planet {
          position: absolute;
          top: -240px;
          left: -120px;
          width: 750px;
          height: 420px;
          border-radius: 50%;
          background: radial-gradient(circle at 50% 60%, #fdba74 0%, #f43f5e 40%, #881337 70%, #1e1b4b 100%);
          filter: drop-shadow(0 0 45px rgba(244, 63, 94, 0.65)) drop-shadow(0 0 90px rgba(168, 85, 247, 0.4));
          border-bottom: 2px solid rgba(254, 215, 170, 0.9);
          transform: rotate(-12deg);
        }

        .planet-glow-ring {
          position: absolute;
          top: -250px;
          left: -130px;
          width: 770px;
          height: 440px;
          border-radius: 50%;
          border-bottom: 3px solid rgba(253, 186, 116, 0.85);
          filter: blur(4px);
          transform: rotate(-12deg);
        }

        /* Floating Drone */
        @keyframes float-drone {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-12px) rotate(1.5deg); }
        }

        @keyframes rotor-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        .drone-wrap {
          position: absolute;
          top: 45px;
          right: 90px;
          animation: float-drone 4.5s ease-in-out infinite;
        }

        /* Circuit line energy flow */
        @keyframes line-flow {
          0% { stroke-dashoffset: 600; }
          100% { stroke-dashoffset: 0; }
        }

        @keyframes pulse-glow {
          0%, 100% { filter: drop-shadow(0 0 6px #a855f7) drop-shadow(0 0 12px #38bdf8); }
          50% { filter: drop-shadow(0 0 14px #c084fc) drop-shadow(0 0 24px #38bdf8); }
        }

        .circuit-line {
          stroke-dasharray: 600;
          stroke-dashoffset: 0;
          animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Content block */
        .content {
          position: absolute;
          top: 140px;
          left: 140px;
          max-width: 680px;
          z-index: 10;
        }

        .badge-tag {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 12px;
          background: rgba(168, 85, 247, 0.15);
          border: 1px solid rgba(192, 132, 252, 0.4);
          border-radius: 20px;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 1.2px;
          color: #e9d5ff;
          text-transform: uppercase;
          margin-bottom: 14px;
          box-shadow: 0 0 15px rgba(168, 85, 247, 0.25);
        }

        .badge-dot {
          width: 6px;
          height: 6px;
          background: #38bdf8;
          border-radius: 50%;
          box-shadow: 0 0 8px #38bdf8;
        }

        .title {
          font-size: 52px;
          font-weight: 800;
          line-height: 1.1;
          margin: 0 0 16px 0;
          letter-spacing: -0.03em;
          background: linear-gradient(180deg, #ffffff 30%, #e2e8f0 70%, #94a3b8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
        }

        .subtitle {
          font-size: 17px;
          line-height: 1.5;
          color: #94a3b8;
          margin: 0 0 24px 0;
          max-width: 620px;
          font-weight: 400;
        }

        .cta-container {
          display: flex;
          align-items: center;
          gap: 16px;
        }

        .status-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 8px 16px;
          background: rgba(15, 23, 42, 0.7);
          border: 1px solid rgba(56, 189, 248, 0.3);
          border-radius: 8px;
          font-size: 13px;
          color: #cbd5e1;
          backdrop-filter: blur(8px);
        }

        .code-pill {
          position: absolute;
          left: 63px;
          top: 250px;
          width: 38px;
          height: 38px;
          background: #0f172a;
          border: 1px solid rgba(168, 85, 247, 0.5);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #c084fc;
          font-weight: bold;
          font-size: 14px;
          box-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
          z-index: 20;
        }

        .status-dot {
          width: 8px;
          height: 8px;
          background: #22c55e;
          border-radius: 50%;
          box-shadow: 0 0 10px #22c55e;
        }
      </style>

      <div class="container">
        <!-- Star field -->
        <div class="star" style="top: 25px; left: 320px; width: 2px; height: 2px; animation-delay: 0.2s;"></div>
        <div class="star" style="top: 60px; left: 550px; width: 3px; height: 3px; animation-delay: 1.1s;"></div>
        <div class="star" style="top: 110px; left: 820px; width: 2px; height: 2px; animation-delay: 0.7s;"></div>
        <div class="star" style="top: 190px; left: 950px; width: 3px; height: 3px; animation-delay: 1.8s;"></div>
        <div class="star" style="top: 310px; left: 740px; width: 2px; height: 2px; animation-delay: 0.4s;"></div>
        <div class="star" style="top: 380px; left: 880px; width: 2px; height: 2px; animation-delay: 2.3s;"></div>
        <div class="star" style="top: 75px; left: 1040px; width: 3px; height: 3px; animation-delay: 1.5s;"></div>
        <div class="star" style="top: 260px; left: 1120px; width: 2px; height: 2px; animation-delay: 0.9s;"></div>

        <!-- Glowing curved planet horizon -->
        <div class="planet"></div>
        <div class="planet-glow-ring"></div>

        <!-- Flowing circuit SVG trace -->
        <svg style="position: absolute; top: 0; left: 0; width: 200px; height: 440px; z-index: 5;" viewBox="0 0 200 440">
          <defs>
            <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fdba74" stop-opacity="0.9" />
              <stop offset="25%" stop-color="#c084fc" stop-opacity="1" />
              <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#22c55e" stop-opacity="0.9" />
            </linearGradient>
            <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>
          <path d="M 120 40 C 90 70, 82 120, 82 220 L 82 440" 
                fill="none" 
                stroke="url(#circuit-grad)" 
                stroke-width="3" 
                filter="url(#neon-glow)"
                class="circuit-line" />
          <circle cx="120" cy="40" r="4.5" fill="#ffffff" filter="drop-shadow(0 0 6px #fdba74)" />
        </svg>

        <!-- Code Symbol Pill on the circuit line -->
        <div class="code-pill">&lt;&nbsp;&gt;</div>

        <!-- GitHub Drone Illustration (Upper Right) -->
        <div class="drone-wrap">
          <svg width="260" height="150" viewBox="0 0 260 150" fill="none">
            <defs>
              <linearGradient id="drone-rotor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
                <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#22c55e" stop-opacity="0.8"/>
              </linearGradient>
              <linearGradient id="drone-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#334155"/>
                <stop offset="100%" stop-color="#0f172a"/>
              </linearGradient>
            </defs>
            <!-- Rotor disc blades -->
            <ellipse cx="130" cy="50" rx="100" ry="18" fill="url(#drone-rotor-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="14 8" style="animation: rotor-spin 2s linear infinite; transform-origin: 130px 50px;" />
            <ellipse cx="130" cy="50" rx="70" ry="11" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.6"/>
            <!-- Drone Central Hub -->
            <rect x="105" y="42" width="50" height="24" rx="6" fill="url(#drone-body-grad)" stroke="#475569" stroke-width="1"/>
            <circle cx="130" cy="54" r="5" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
            <!-- Lower payload / camera module -->
            <path d="M 115 66 L 145 66 L 140 85 L 120 85 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
            <rect x="124" y="74" width="12" height="6" rx="2" fill="#22c55e" filter="drop-shadow(0 0 6px #22c55e)"/>
            <!-- Landing gear legs -->
            <path d="M 110 70 L 80 120 L 70 120" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 150 70 L 180 120 L 190 120" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="70" cy="120" r="2.5" fill="#38bdf8"/>
            <circle cx="190" cy="120" r="2.5" fill="#38bdf8"/>
          </svg>
        </div>

        <!-- Typography & Hero Section -->
        <div class="content">
          <div class="badge-tag">
            <span class="badge-dot"></span>
            GitHub Universe // Developer Space
          </div>
          <h1 class="title">Let’s build from here</h1>
          <p class="subtitle">
            Harnessed for productivity. Designed for innovation. Building scalable software, modern web platforms, and open-source solutions.
          </p>
          <div class="cta-container">
            <div class="status-pill">
              <span class="status-dot"></span>
              <span>Available for collaboration</span>
            </div>
            <div class="status-pill" style="border-color: rgba(168, 85, 247, 0.35);">
              <span style="color: #c084fc;">⚡</span>
              <span>Full-Stack &amp; Systems</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
